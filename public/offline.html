<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex" />
    <title>Нет соединения — LUXE VAULT</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      @font-face {
        font-family: 'Bodoni Moda';
        src: url('/fonts/bodoni-moda-latin.woff2') format('woff2');
        font-display: swap;
      }
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 64px 24px;
        background: #000000;
        color: #cccccc;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main { max-width: 28rem; display: flex; flex-direction: column; align-items: center; }
      .rule { width: 48px; height: 1px; background: rgba(212, 175, 55, 0.6); }
      h1 {
        margin-top: 24px;
        font-family: 'Bodoni Moda', Didot, Georgia, serif;
        font-weight: 400;
        font-size: 28px;
        letter-spacing: 0.02em;
        text-wrap: balance;
      }
      p { margin-top: 16px; font-size: 14px; font-weight: 300; line-height: 1.6; }
      .en { margin-top: 8px; color: #8a8a8a; font-size: 13px; }
      button {
        margin-top: 40px;
        padding: 12px 32px;
        border: 1px solid #d4af37;
        background: transparent;
        color: #d4af37;
        font: inherit;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background-color 0.3s, color 0.3s;
      }
      button:hover { background: #d4af37; color: #000000; }
      button:focus-visible { outline: 2px solid #d4af37; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main role="alert">
      <span class="rule" aria-hidden="true"></span>
      <h1>Нет соединения</h1>
      <p>Проверьте подключение к интернету — страница откроется, как только связь восстановится. Ваша корзина сохранена.</p>
      <p class="en" lang="en">You're offline. Your cart is saved; the page will load once you're back online.</p>
      <button type="button" id="retry">Повторить</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        location.reload()
      })
      window.addEventListener('online', function () {
        location.reload()
      })
    </script>
  </body>
</html>
