# Keeps the SHA-pinned GitHub Actions current, and proposes npm updates within
# the current major versions. Each update arrives as a pull request that CI
# (ci.yml) checks.
#
# Major npm upgrades (Next, React, Tailwind, ESLint, Stripe.js…) are migrations,
# not bumps: they are ignored here and done deliberately, as their own change.
# Security alerts still appear under Security → Dependabot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
