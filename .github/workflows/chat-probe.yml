# TEMPORARY diagnostic (deleted after use). No secrets, read-only.
name: Chat probe (temporary)
on:
  push:
    branches: [claude/chat-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          set +e
          S=https://www.luxe-vault.store
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Mobile Safari/537.36'
          # Smart search: same key, gemini-3.6-flash (or GEMINI_MODEL)
          for Q in "black jacket for an elegant evening dinner $RANDOM" "warm outfit for a winter walk in the mountains $RANDOM"; do
            T0=$(date +%s.%N)
            B=$(curl -sS -m 40 -A "$UA" -G "$S/api/search" --data-urlencode "q=$Q" --data-urlencode "ai=1" --data-urlencode "locale=en")
            echo "::notice title=SEARCH ai=1::time=$(echo "$(date +%s.%N) - $T0" | bc)s || ai used: $(echo "$B" | jq -c '.interpretation.ai') || filters: $(echo "$B" | jq -c '[.interpretation.filters[]?.kind]')"
          done
          # Chat: gemini-3.8-flash (or GEMINI_MODEL)
          for Q in 'How much is shipping?' 'Hello' 'Ты хто?' 'Do you have a black coat?'; do
            BODY=$(jq -cn --arg q "$Q" '{locale:"en",messages:[{role:"user",text:$q}],orders:[]}')
            T0=$(date +%s.%N)
            B=$(curl -sS -m 60 -A "$UA" -X POST -H 'content-type: application/json' -H "origin: $S" -H 'sec-fetch-site: same-origin' "$S/api/support/assistant" --data "$BODY")
            echo "::notice title=CHAT $Q::time=$(echo "$(date +%s.%N) - $T0" | bc)s || $(echo "$B" | head -c 400)"
          done
