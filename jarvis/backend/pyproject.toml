[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — personal AI operating layer: agent runtime, memory, tools, skills, channels, voice"
requires-python = ">=3.11"
readme = "../README.md"
license = { text = "Proprietary — personal use" }
dependencies = [
  # brain
  "anthropic>=1.8,<2",
  # api / runtime
  "fastapi>=0.141",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "python-multipart>=0.0.32",
  # storage
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.31",
  "alembic>=1.20",
  "pgvector>=0.5",
  "redis>=8.1",
  # security
  "argon2-cffi>=25.1",
  "cryptography>=50",
  "pyotp>=2.10",
  # observability
  "structlog>=26.1",
  "prometheus-client>=0.26",
  # scheduling / time
  "croniter>=6.2",
  "python-dateutil>=2.9",
  "tzdata",
  # tools
  "httpx>=0.28",
  "beautifulsoup4>=4.15",
  "pypdf>=6.19",
  "pyyaml>=6.0.3",
  "jsonschema>=4.26",
  "mcp>=2.2",
]

[project.optional-dependencies]
# Local, private, key-free embeddings (ONNX on CPU). ~220 MB model download on first use.
local-embeddings = ["fastembed>=0.8.1"]
# Connects to the Playwright browser container.
browser = ["playwright>=1.63"]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4"]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.ruff]
line-length = 110
target-version = "py311"
