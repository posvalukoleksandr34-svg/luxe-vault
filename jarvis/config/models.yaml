# Model routing. Each route = provider + model + parameters. Edit and restart api/worker.
#
# Main brain: Claude Opus 5 — strongest agentic tool use and long-horizon reliability, 1M context,
# adaptive thinking, prompt caching, server-side web search. `fallbacks: default` re-runs a request
# on Anthropic's recommended fallback model if a safety classifier declines it.
# Effort is the latency/cost dial: interactive chat runs at medium, background work at high,
# voice at low (first audio fast). Raise `main.effort` to high if you prefer depth over speed.
routes:
  main:   {provider: anthropic, model: claude-opus-5, effort: medium, max_tokens: 32000, fallbacks: default, fallback_route: local}
  deep:   {provider: anthropic, model: claude-opus-5, effort: high, max_tokens: 64000, fallbacks: default}
  voice:  {provider: anthropic, model: claude-opus-5, effort: low, max_tokens: 8000, fallbacks: default}
  # Sub-agents (research/browser/coding/planner) do reading-heavy work: cheaper, still strong.
  worker: {provider: anthropic, model: claude-sonnet-5, effort: medium, max_tokens: 32000}
  # Memory extraction, de-duplication, classifiers: fast and cheap, structured JSON output.
  fast:   {provider: anthropic, model: claude-haiku-4-5, thinking: none, max_tokens: 4096, eager_tool_streaming: false, server_tools: false}
  # Optional private/offline model (Ollama, vLLM, LM Studio). Used as failover for `main` when
  # JARVIS_LOCAL_LLM_BASE_URL is set, e.g. http://ollama:11434/v1
  local:  {provider: openai_compat, model: "qwen3:14b", thinking: none, max_tokens: 8000, server_tools: false}

# USD per 1M tokens (cache read = 0.1x input, cache write = 1.25x input unless given).
pricing:
  claude-opus-5:    {input: 5.0, output: 25.0}
  claude-opus-5-5:  {input: 4.0, output: 20.0}
  claude-fable-5-1: {input: 10.0, output: 50.0}
  claude-sonnet-5:  {input: 2.0, output: 10.0}
  claude-haiku-4-5: {input: 1.0, output: 5.0}
