global:
  scrape_interval: 30s
scrape_configs:
  - job_name: jarvis-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: jarvis-worker
    static_configs: [{ targets: ["worker:9100"] }]
