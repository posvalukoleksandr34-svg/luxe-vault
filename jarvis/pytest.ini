[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = backend/tests skills
pythonpath = backend
python_files = test_*.py
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: needs PostgreSQL + Redis (JARVIS_TEST_DATABASE_URL / JARVIS_TEST_REDIS_URL)
